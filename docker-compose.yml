services:
  postgres:
    image: postgres:17-alpine
    container_name: publius-postgres
    environment:
      POSTGRES_DB: publius
      POSTGRES_PASSWORD: publius
      POSTGRES_USER: publius
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publius -d publius"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - publius_postgres:/var/lib/postgresql/data

volumes:
  publius_postgres:
